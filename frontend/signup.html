<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - AI Study Buddy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="navbar">
    <div class="brand">🧠 AI Study Buddy</div>
  </div>

  <div class="container-narrow">
    <div class="card">
      <h2>Create your account</h2>
      <p class="helper-text" style="margin-bottom:20px;">Start generating quizzes and flashcards in seconds.</p>

      <div id="signup-error" class="alert alert-error hidden"></div>

      <form id="signup-form">
        <div class="form-group">
          <label for="signup-username">Username</label>
          <input type="text" id="signup-username" placeholder="yourusername" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="At least 6 characters" autocomplete="new-password">
        </div>
        <button type="submit" id="signup-submit" class="btn btn-primary btn-block">Sign Up</button>
      </form>

      <p class="helper-text" style="text-align:center; margin-top:16px;">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
