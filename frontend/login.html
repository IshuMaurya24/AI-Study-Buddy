<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In - AI Study Buddy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="navbar">
    <div class="brand">🧠 AI Study Buddy</div>
  </div>

  <div class="container-narrow">
    <div class="card">
      <h2>Welcome back</h2>
      <p class="helper-text" style="margin-bottom:20px;">Log in to continue studying.</p>

      <div id="login-error" class="alert alert-error hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" placeholder="yourusername" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" id="login-submit" class="btn btn-primary btn-block">Log In</button>
      </form>

      <p class="helper-text" style="text-align:center; margin-top:16px;">
        Don't have an account? <a href="signup.html">Sign up</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
